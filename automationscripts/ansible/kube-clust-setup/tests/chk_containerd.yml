---
- name: Check if containerd is available
  command: command -v containerd
  register: containerd_output
  failed_when: false  # Prevent the play from aborting the execution if return-code is non-zero
  changed_when: false # Prevent showing false-positive of "changed" value, since we are only checking whether command exists in $PATH 

- name: Show message if containerd is not available
  assert:
    that:
      - containerd_output.rc == '0'
    fail_msg: "Containerd command is not part of the $PATH variable"
    success_msg: "Found containerd command in $PATH" 