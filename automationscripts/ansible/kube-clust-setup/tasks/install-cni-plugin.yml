# tasks file for kube-clust-setup
- name: Download the cni-plugins tarball
  ansible.builtin.get_url:
    url: https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-amd64-v1.9.1.tgz
    dest: /tmp/

- name: Create cni-plugins directory
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory

- name: Extract the cni-plugins tarball at /opt/cni/bin
  ansible.builtin.unarchive:
    src: /tmp/cni-plugins-linux-amd64-v1.9.1.tgz
    dest: /opt/cni/bin
    remote_src: true 