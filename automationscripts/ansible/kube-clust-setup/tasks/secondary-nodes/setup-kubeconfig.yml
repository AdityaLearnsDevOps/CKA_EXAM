---
- name: Create $HOME/.kube directory on worker nodes
  ansible.builtin.file:
    path: /home/ec2-user/.kube
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'
  tags: post-setup

- name: Copy contents of admin.conf to ~/.kube/config file
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ec2-user/.kube/config
    remote_src: true
    owner: ec2-user
    group: ec2-user
    mode: '0600'
  tags: post-setup