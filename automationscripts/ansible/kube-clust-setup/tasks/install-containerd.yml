# tasks file for kube-clust-setup
- name: Download the containerd tarball
  ansible.builtin.get_url:
    url: https://github.com/containerd/containerd/releases/download/v2.3.3/containerd-2.3.3-linux-amd64.tar.gz
    dest: /tmp/

- name: Extract the containerd tarball at /usr/local
  ansible.builtin.unarchive:
    src: /tmp/containerd-2.3.3-linux-amd64.tar.gz
    dest: /usr/local/
    remote_src: true 

- name: Create containerd.service directory
  ansible.builtin.file:
    path: /usr/local/lib/systemd/service/containerd.service
    state: directory

- name: Download the template of containerd.service into newly created directory
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/containerd/containerd/main/containerd.service
    dest: /usr/local/lib/systemd/service/containerd.service/

- name: Create a symlink to the containerd.service directory
  ansible.builtin.file:
    src: /usr/local/lib/systemd/service/containerd.service/containerd.service
    dest: /usr/lib/systemd/system/containerd.service
    state: link

- name: Ensure that containerd runs as a system service
  ansible.builtin.systemd_service:
    name: containerd.service
    enabled: true
    state: started
